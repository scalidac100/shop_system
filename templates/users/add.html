{% extends "base.html" %}

{% block title %}
Add User
{% endblock %}

{% block content %}

<div class="d-flex justify-content-between align-items-center mb-4">

    <h2>
        <i class="bi bi-person-plus"></i>
        Add User
    </h2>

    <a
        href="{{ url_for('users.index') }}"
        class="btn btn-secondary"
    >
        <i class="bi bi-arrow-left"></i>
        Back
    </a>

</div>


<div class="card shadow-sm">

    <div class="card-body">

        <form method="POST">

            <div class="mb-3">

                <label class="form-label">
                    Username
                </label>

                <input
                    type="text"
                    name="username"
                    class="form-control"
                    required
                >

            </div>


            <div class="mb-3">

                <label class="form-label">
                    Password
                </label>

                <input
                    type="password"
                    name="password"
                    class="form-control"
                    required
                >

            </div>


            <div class="mb-3">

                <label class="form-label">
                    Role
                </label>

                <select
                    name="role"
                    class="form-select"
                    required
                >

                    <option value="staff">
                        Staff
                    </option>

                    <option value="admin">
                        Admin
                    </option>

                </select>

            </div>


            <button
                type="submit"
                class="btn btn-primary"
            >
                <i class="bi bi-save"></i>
                Save User
            </button>

        </form>

    </div>

</div>

{% endblock %}
