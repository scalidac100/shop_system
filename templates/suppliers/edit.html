{% extends "base.html" %}

{% block title %}
Edit Supplier
{% endblock %}

{% block content %}

<div class="d-flex justify-content-between align-items-center mb-4">

    <div>
        <h2>
            <i class="bi bi-pencil-square"></i>
            Edit Supplier
        </h2>

        <p class="text-muted">
            Update supplier information
        </p>
    </div>

    <a
        href="{{ url_for('suppliers.index') }}"
        class="btn btn-secondary"
    >
        <i class="bi bi-arrow-left"></i>
        Back
    </a>

</div>


<div class="card shadow-sm border-0">

    <div class="card-body p-4">

        <form method="POST">

            <div class="row">

                <div class="col-md-6 mb-3">

                    <label class="form-label">
                        Supplier Name
                    </label>

                    <input
                        type="text"
                        name="name"
                        class="form-control"
                        value="{{ supplier.name }}"
                        required
                    >

                </div>

                <div class="col-md-6 mb-3">

                    <label class="form-label">
                        Phone
                    </label>

                    <input
                        type="text"
                        name="phone"
                        class="form-control"
                        value="{{ supplier.phone or '' }}"
                    >

                </div>

                <div class="col-12 mb-3">

                    <label class="form-label">
                        Address
                    </label>

                    <input
                        type="text"
                        name="address"
                        class="form-control"
                        value="{{ supplier.address or '' }}"
                    >

                </div>

            </div>

            <hr class="my-4">

            <div class="d-flex justify-content-end gap-2">

                <a
                    href="{{ url_for('suppliers.index') }}"
                    class="btn btn-light"
                >
                    Cancel
                </a>

                <button
                    type="submit"
                    class="btn btn-primary"
                >
                    <i class="bi bi-check-circle"></i>
                    Update Supplier
                </button>

            </div>

        </form>

    </div>

</div>

{% endblock %}
