{% extends "base.html" %}

{% block title %}
Add Product
{% endblock %}

{% block content %}

<div class="d-flex justify-content-between align-items-center mb-4">

    <div>
        <h2>
            <i class="bi bi-box-seam"></i>
            Add Product
        </h2>

        <p class="text-muted">
            Add a new product to your shop
        </p>
    </div>

    <a
        href="{{ url_for('products.index') }}"
        class="btn btn-secondary"
    >
        <i class="bi bi-arrow-left"></i>
        Back
    </a>

</div>


<div class="card shadow-sm border-0">

    <div class="card-body p-4">

        <form method="POST">

            <div class="row">

                <!-- PRODUCT NAME -->

                <div class="col-md-6 mb-3">

                    <label class="form-label">
                        Product Name
                    </label>

                    <input
                        type="text"
                        name="name"
                        class="form-control"
                        placeholder="Enter product name"
                        required
                    >

                </div>


                <!-- CATEGORY -->

                <div class="col-md-6 mb-3">

                    <label class="form-label">
                        Category
                    </label>

                    <select
                        name="category_id"
                        class="form-select"
                        required
                    >

                        <option value="">
                            -- Select Category --
                        </option>

                        {% for category in categories %}

                        <option value="{{ category.id }}">
                            {{ category.name }}
                        </option>

                        {% endfor %}

                    </select>

                </div>


                <!-- BUYING PRICE -->

                <div class="col-md-4 mb-3">

                    <label class="form-label">
                        Buying Price
                    </label>

                    <div class="input-group">

                        <span class="input-group-text">
                            TZS
                        </span>

                        <input
                            type="number"
                            step="0.01"
                            min="0"
                            name="buying_price"
                            class="form-control"
                            placeholder="0.00"
                            required
                        >

                    </div>

                </div>


                <!-- SELLING PRICE -->

                <div class="col-md-4 mb-3">

                    <label class="form-label">
                        Selling Price
                    </label>

                    <div class="input-group">

                        <span class="input-group-text">
                            TZS
                        </span>

                        <input
                            type="number"
                            step="0.01"
                            min="0"
                            name="selling_price"
                            class="form-control"
                            placeholder="0.00"
                            required
                        >

                    </div>

                </div>


                <!-- QUANTITY -->

                <div class="col-md-4 mb-3">

                    <label class="form-label">
                        Initial Stock
                    </label>

                    <input
                        type="number"
                        name="quantity"
                        class="form-control"
                        min="0"
                        placeholder="0"
                        required
                    >

                </div>

            </div>


            <hr class="my-4">


            <div class="d-flex justify-content-end gap-2">

                <a
                    href="{{ url_for('products.index') }}"
                    class="btn btn-light"
                >
                    Cancel
                </a>

                <button
                    type="submit"
                    class="btn btn-primary"
                >
                    <i class="bi bi-check-circle"></i>
                    Save Product
                </button>

            </div>

        </form>

    </div>

</div>

{% endblock %}
